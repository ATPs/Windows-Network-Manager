<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Windows Network Manager</title><link rel="stylesheet" href="/style.css" /></head>
  <body>
    <div class="app-chrome">
      <header class="topbar"><div><p id="subtitle" class="eyebrow"></p><h1>Windows Network Manager</h1></div><div class="header-actions"><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-CN">中文</option></select><span id="privilege" class="badge"></span><button id="restart-admin" class="secondary"></button><button id="refresh" class="primary"></button></div></header>
      <nav id="nav"><a href="#current">Current state</a><a href="#interfaces">Interfaces</a><a href="#routes">Routes</a><a href="#configs">Configurations</a><a href="#diagnostics">Diagnostics</a></nav>
    </div>
    <main>
      <p id="status" class="status"></p>
      <section id="current" class="panel"><div class="heading"><div><p class="eyebrow">Current state</p><h2 id="current-title"></h2></div><div class="actions"><button id="reset-baseline" class="warning"></button><button id="windows-defaults" class="danger"></button></div></div><p id="reset-help" class="hint"></p><div id="change-summary" class="summary"></div></section>
      <section id="interfaces" class="panel"><div class="heading"><div><p class="eyebrow">Network interfaces</p><h2 id="interfaces-title"></h2></div><label class="toggle"><input id="show-system" type="checkbox" /><span id="show-system-label"></span></label></div><div id="interface-list" class="cards"></div></section>
      <section id="routes" class="panel"><div class="heading"><div><p class="eyebrow">Routing</p><h2 id="routes-title"></h2></div><button id="refresh-routes" class="secondary"></button></div><div class="filters"><label><span id="family-label"></span><select id="route-family"><option value="IPv4">IPv4</option><option value="IPv6">IPv6</option><option value="all">All</option></select></label><label><span id="search-label"></span><input id="route-search" type="search" /></label><label class="toggle"><input id="show-all-routes" type="checkbox" /><span id="show-all-label"></span></label></div><div class="table-wrap"><table><thead><tr><th>Family</th><th>Destination</th><th>Next hop</th><th>Interface</th><th>Metric</th><th>Type</th><th></th></tr></thead><tbody id="route-rows"></tbody></table></div><form id="route-form" class="form-grid"><h3 id="add-route-title"></h3><label><span id="destination-label"></span><input name="destinationPrefix" placeholder="172.16.0.0/12" required /></label><label><span id="next-hop-label"></span><input name="nextHop" placeholder="192.168.3.1" required /></label><label><span id="interface-label"></span><select name="interfaceIndex"></select></label><label><span id="metric-label"></span><input name="routeMetric" type="number" min="1" max="9999" value="5" required /></label><label class="toggle"><input name="persistent" type="checkbox" /><span id="persistent-label"></span></label><button id="add-route" class="primary" type="submit"></button></form></section>
      <section id="configs" class="panel"><div class="heading"><div><p class="eyebrow">Configurations</p><h2 id="configs-title"></h2></div><div class="actions"><button id="save-current" class="primary"></button><button id="save-profile" class="primary">Save named configuration</button><button id="import-config" class="secondary"></button><button id="export-config" class="secondary"></button></div></div><h3>Saved configurations</h3><div id="profile-list" class="recent-list"></div><p id="recent-help" class="hint"></p><div id="recent-list" class="recent-list"></div></section>
      <section id="diagnostics" class="panel"><div class="heading"><div><p class="eyebrow">Troubleshooting</p><h2 id="diagnostics-title"></h2></div><button id="copy-diagnostics" class="secondary"></button></div><pre id="diagnostics-output"></pre></section>
    </main>
    <dialog id="confirm"><form method="dialog"><h2 id="confirm-title"></h2><pre id="confirm-text"></pre><div class="actions"><button value="cancel" class="secondary">Cancel</button><button value="confirm" class="danger">Confirm</button></div></form></dialog>
    <script type="module" src="/main.js"></script>
  </body>
</html>
