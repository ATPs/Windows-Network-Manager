[package]
name = "windows-network-manager"
version = "1.1.2"
description = "Windows network interface diagnostics and profile manager"
authors = ["ATPs"]
edition = "2021"

[lib]
name = "windows_network_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "windows-network-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
